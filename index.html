<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Convite · Words Together</title>
<meta property="og:title" content="Vamos jogar Words Together?">
<meta property="og:description" content="Toque para entrar na sala de palavras cruzadas.">
<style>
  :root {
    --paper: #efe7d6; --cell: #fbf8f0; --ink: #1d1b18; --soft: #5e574c;
    --accent: #c2352b; --tape: rgba(242, 219, 140, .8);
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #1a1917; --cell: #2d2b27; --ink: #ede5d3; --soft: #a69e8e; --accent: #e25a4c; --tape: rgba(199, 176, 107, .55); }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--paper); color: var(--ink); font-family: Georgia, "Times New Roman", serif; padding: 24px 16px;
  }
  main { width: 100%; max-width: 460px; text-align: center; }
  .edition { font-family: "Courier New", monospace; font-size: 13px; letter-spacing: .12em; color: var(--soft); }
  .rule { border-top: 3px double var(--ink); margin: 8px 0; }
  h1 { font-size: 44px; margin: 6px 0; letter-spacing: -.01em; }
  .tagline { font-style: italic; margin: 6px 0 22px; }
  .stamp {
    position: relative; background: var(--cell); padding: 22px 16px 18px; transform: rotate(-1.5deg);
    box-shadow: 4px 5px 0 rgba(0,0,0,.18); margin: 0 auto 26px;
  }
  .stamp::before {
    content: ""; position: absolute; top: -12px; left: 50%; width: 120px; height: 26px; margin-left: -60px;
    background: var(--tape); transform: rotate(-4deg);
  }
  .label { font-family: "Courier New", monospace; font-size: 14px; color: var(--soft); letter-spacing: .1em; }
  .code { font-size: 64px; font-weight: bold; color: var(--accent); letter-spacing: .12em; margin-top: 4px; }
  .button {
    display: block; width: 100%; padding: 18px 12px; margin: 0 0 14px; border: 0; cursor: pointer;
    font: bold 24px Georgia, serif; text-decoration: none; box-shadow: 3px 4px 0 rgba(0,0,0,.2);
  }
  .primary { background: var(--accent); color: #fff; transform: rotate(.8deg); }
  .secondary { background: var(--cell); color: var(--ink); transform: rotate(-.6deg); font-size: 19px; font-family: "Courier New", monospace; }
  .button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .help { font-size: 16px; line-height: 1.45; color: var(--soft); margin-top: 18px; }
  .invalid { font-size: 20px; margin: 30px 0; }
  @media (prefers-reduced-motion: reduce) { .stamp, .primary, .secondary { transform: none; } }
</style>
</head>
<body>
<main>
  <div class="edition">EDIÇÃO DE CONVITE</div>
  <div class="rule"></div>
  <h1>Words Together</h1>
  <div class="rule"></div>
  <p class="tagline">Palavras cruzadas para resolver juntos.</p>

  <section id="room" hidden>
    <div class="stamp">
      <div class="label">CÓDIGO DA SALA</div>
      <div class="code" id="code"></div>
    </div>
    <a class="button primary" id="open" href="#">ENTRAR NA SALA</a>
    <button class="button secondary" id="copy" type="button">COPIAR CÓDIGO</button>
    <p class="help">O jogo não abriu? Abra o <b>Words Together</b>, toque em <b>JOGAR COM ALGUÉM</b> e digite o código acima.</p>
  </section>

  <p class="invalid" id="invalid" hidden>Este convite não tem um código de sala válido. Peça um convite novo para quem criou a sala.</p>
</main>
<script>
  (function () {
    // Same alphabet and length as the game's room codes (WordsTogetherApp.TryReadInvitation).
    var raw = (new URLSearchParams(location.search).get("sala") || "").trim().toUpperCase();
    if (!/^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{5}$/.test(raw)) {
      document.getElementById("invalid").hidden = false;
      return;
    }

    document.getElementById("room").hidden = false;
    document.getElementById("code").textContent = raw;
    var android = /Android/i.test(navigator.userAgent);
    // Android browsers open apps more reliably through an intent link than through a bare custom scheme.
    var link = android
      ? "intent://join/" + raw + "#Intent;scheme=wordstogether;end"
      : "wordstogether://join/" + raw;
    var open = document.getElementById("open");
    open.href = link;

    var copy = document.getElementById("copy");
    copy.addEventListener("click", function () {
      var done = function () { copy.textContent = "CÓDIGO COPIADO"; };
      if (navigator.clipboard) navigator.clipboard.writeText(raw).then(done, function () {});
    });
  })();
</script>
</body>
</html>
